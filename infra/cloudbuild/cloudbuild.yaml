# gcp-proof-platform Cloud Build pipeline (DevSecOps):
#   build all images -> push to Artifact Registry -> Checkov (IaC) ->
#   Trivy (images) -> SBOM -> eval gate -> unit tests
# Trigger via Cloud Build trigger (github push to main) or:
#   gcloud builds submit --config infra/cloudbuild/cloudbuild.yaml --substitutions=_TAG=<sha>
substitutions:
  _REGION: "us-central1"
  _REPO: "ai-platform"
  _TAG: "latest"

steps:
  # --- Build + push the 4 interactive services ---
  - id: build-gateway
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:latest
      - services/gateway
  - id: push-gateway
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}"]
    waitFor: ["build-gateway"]

  - id: build-rag-api
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-api:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-api:latest
      - services/rag-api
  - id: push-rag-api
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-api:${_TAG}"]
    waitFor: ["build-rag-api"]

  - id: build-dotnet-ingest
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dotnet-ingest:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dotnet-ingest:latest
      - services/dotnet-ingest
  - id: push-dotnet-ingest
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dotnet-ingest:${_TAG}"]
    waitFor: ["build-dotnet-ingest"]

  - id: build-evaluator
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/evaluator:${_TAG}
      - services/evaluator
  - id: push-evaluator
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/evaluator:${_TAG}"]
    waitFor: ["build-evaluator"]

  # --- DevSecOps: policy-as-code (Checkov) on the Terraform ---
  - id: checkov-iac
    name: "bridgecrew/checkov:latest"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set +e
        checkov -d infra/terraform --framework terraform --quiet --compact > /workspace/checkov.log 2>&1
        rc=$?
        if [ $rc -ne 0 ] && grep -Eq 'HIGH|CRITICAL' /workspace/checkov.log; then
          echo "CHECKOV FAILED: HIGH/CRITICAL IaC findings"
          cat /workspace/checkov.log
          exit 1
        fi
        echo "checkov: no HIGH/CRITICAL findings (rc=$rc)"
    waitFor: ["-"]

  # --- DevSecOps: authenticate to Artifact Registry for image scans ---
  - id: docker-login
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker login -u oauth2accesstoken \
          -p "$(gcloud auth print-access-token)" \
          https://${_REGION}-docker.pkg.dev
    waitFor: ["push-gateway", "push-rag-api", "push-dotnet-ingest", "push-evaluator"]

  # --- DevSecOps: Trivy container scans + SBOM generation ---
  - id: trivy-scan
    name: "aquasec/trivy:latest"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        mkdir -p /workspace/sbom
        for img in gateway rag-api dotnet-ingest evaluator; do
          IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/$${img}:${_TAG}
          echo "== scanning $${img} =="
          trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --no-progress "$${IMAGE}" || exit 1
          trivy image --format spdx --no-progress \
            --output /workspace/sbom/$${img}.spdx.json "$${IMAGE}" || exit 1
        done
        echo "trivy: no HIGH/CRITICAL findings; SBOMs written"
    waitFor: ["docker-login"]

  # --- Evaluation gate: fail the build if quality regresses ---
  - id: eval-gate
    name: "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/evaluator:${_TAG}"
    args: ["--dataset", "/app/datasets/eval_set.jsonl", "--threshold", "0.8"]
    waitFor: ["push-evaluator"]

  # --- Run tests (unit tests per service, in parallel) ---
  - id: test-python
    name: "python:3.12"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        pip install -q -r services/rag-api/requirements-dev.txt -r services/evaluator/requirements-dev.txt
        python -m pytest services/rag-api/tests services/evaluator/tests -q
    waitFor: ["-"]
  - id: test-node
    name: "node:22"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        cd services/gateway && npm ci --silent && npm run typecheck && npm run build && npm test
    waitFor: ["-"]
  - id: test-dotnet
    name: "mcr.microsoft.com/dotnet/sdk:8.0"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        cd services/dotnet-ingest && dotnet test IngestApi.sln -c Release
    waitFor: ["-"]

# Upload the generated SBOMs as build artifacts.
artifacts:
  objects:
    location: "gs://${PROJECT_ID}_cloudbuild/sbom/${_TAG}"
    paths:
      - "/workspace/sbom/*.spdx.json"

options:
  logging: CLOUD_LOGGING_ONLY